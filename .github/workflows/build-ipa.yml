name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'fix-record-consumption.patch'
  workflow_dispatch:
    inputs:
      variant:
        description: '构建哪一版（test = 包名 .test 后缀、可与正式版并存；release = 正式包名）'
        type: choice
        options: [test, release]
        default: test

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA for iOS 16+
    # 用镜像自带的默认 Xcode（runner 会保持与它配套的 iphonesimulator 运行时）。
    # 资产编译阶段即使只出真机包也会校验 runtime，硬编码旧 Xcode 会版本错配失败。
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode and verify SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "AVAILABLE_RUNTIMES:"
          xcrun simctl list runtimes | sed -n '1,20p'

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Resolve build variant
        run: |
          # push 到 main 一律出正式包；手动触发按输入选择，默认 test。
          VARIANT="${{ github.event.inputs.variant }}"
          [ -n "$VARIANT" ] || VARIANT=release
          # App Group 也跟着变体走：测试包用 .test 后缀的独立容器，
          # 免得测试版把正式版的车况配置与小组件数据覆盖掉。
          if [ "$VARIANT" = "test" ]; then
            {
              echo "TEST_BUILD=1"
              echo "BUNDLE_ID_SUFFIX=.test"
              echo "APP_DISPLAY_NAME=电车助手·测试"
              echo "MG4_APP_GROUP=group.com.evstats.EVLogger.test"
              echo "MG4_WIDGET_GROUP=group.mg4widget.test"
              echo "PACKAGE_SUFFIX=_test"
              echo "ARTIFACT_VARIANT=test"
            } >> "$GITHUB_ENV"
          else
            {
              echo "TEST_BUILD=0"
              echo "BUNDLE_ID_SUFFIX="
              echo "APP_DISPLAY_NAME=电车助手"
              echo "MG4_APP_GROUP=group.com.evstats.EVLogger"
              echo "MG4_WIDGET_GROUP=group.mg4widget"
              echo "PACKAGE_SUFFIX="
              echo "ARTIFACT_VARIANT=release"
            } >> "$GITHUB_ENV"
          fi
          echo "构建变体：$VARIANT（包名 com.evstats.EVLogger${BUNDLE_ID_SUFFIX:-}）"
          echo "App Group：${MG4_APP_GROUP} / ${MG4_WIDGET_GROUP}"

      - name: Verify iOS 16 deployment target
        run: |
          grep -q 'iOS: "16.0"' project.yml
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET: "16.0"' project.yml

      - name: Build device app without a developer certificate
        env:
          # 高德「Web 服务」Key：用仓库 Secret（推荐）或 Variable 提供，二者都没有时为空。
          # 为空时构建照常成功，只是 Info.plist 保留 $(AMAP_KEY) 占位符、App 内可手动填写 Key。
          # 传进脚本后用临时 xcconfig 注入，绝不会出现在 xcodebuild 命令行与日志里。
          AMAP_KEY: ${{ secrets.AMAP_KEY || vars.AMAP_KEY }}
        run: bash scripts/build_device.sh

      - name: Verify Amap key injection state
        run: |
          APP=build-device/Build/Products/Release-iphoneos/MG4Mate.app
          AMAP="$(/usr/libexec/PlistBuddy -c 'Print :AmapKey' "$APP/Info.plist" 2>/dev/null || true)"
          case "$AMAP" in
            *'$('*) echo "高德 Key：未注入（占位符保留，App 内可手动填写）" ;;
            "")     echo "高德 Key：未注入（空值）" ;;
            *)      echo "高德 Key：已注入，长度 ${#AMAP}" ;;
          esac

      - name: Package ad-hoc IPA and TrollStore tipa
        run: bash scripts/package_ipa.sh

      - name: Verify deployment target and bundles
        run: |
          APP=build-device/Build/Products/Release-iphoneos/MG4Mate.app
          test "$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$APP/Info.plist")" = "16.0"
          test -d "$APP/PlugIns/MG4MateWidget.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$APP/PlugIns/MG4MateWidget.appex/Info.plist")" = "16.0"

          # 包名/显示名必须与所选变体一致：测试包绝不能悄悄盖上正式版的包名
          MAIN_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          APPEX_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/PlugIns/MG4MateWidget.appex/Info.plist")"
          DISPLAY="$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist")"
          echo "主程序  $MAIN_ID  $DISPLAY"
          echo "小组件  $APPEX_ID"
          test "$MAIN_ID" = "com.evstats.EVLogger${BUNDLE_ID_SUFFIX}"
          test "$APPEX_ID" = "com.evstats.EVLogger${BUNDLE_ID_SUFFIX}.widget"
          test "$DISPLAY" = "$APP_DISPLAY_NAME"

          # App Group 必须与变体一致（测试包用 .test 独立容器），且不能残留 $(...) 占位符
          MAIN_GROUP="$(/usr/libexec/PlistBuddy -c 'Print MG4AppGroup' "$APP/Info.plist")"
          WIDGET_GROUP="$(/usr/libexec/PlistBuddy -c 'Print MG4WidgetGroup' "$APP/Info.plist")"
          APPEX_GROUP="$(/usr/libexec/PlistBuddy -c 'Print MG4WidgetGroup' "$APP/PlugIns/MG4MateWidget.appex/Info.plist")"
          echo "App Group  $MAIN_GROUP / $WIDGET_GROUP"
          test "$MAIN_GROUP" = "$MG4_APP_GROUP"
          test "$WIDGET_GROUP" = "$MG4_WIDGET_GROUP"
          test "$APPEX_GROUP" = "$MG4_WIDGET_GROUP"
          # 签名里也必须真的带上这两个 group，否则 App Group 会静默失效（配置存不住）。
          # 注意看的是打包脚本签过的那份（dist/Payload），构建目录里的是未签名产物。
          codesign -d --entitlements :- "dist/Payload/MG4Mate.app" 2>&1 | grep -q "$MG4_APP_GROUP"
          codesign -d --entitlements :- "dist/Payload/MG4Mate.app/PlugIns/MG4MateWidget.appex" 2>&1 | grep -q "$MG4_WIDGET_GROUP"
          # 扩展包名必须是主包名的前缀延展，否则 iOS 会当成不相干的两样东西
          case "$APPEX_ID" in
            "$MAIN_ID".*) ;;
            *) echo "appex bundle id 不是主包名的子集：$APPEX_ID"; exit 1 ;;
          esac
          test -n "$(find dist -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tipa' -print -quit)"
          for artifact in dist/*.ipa dist/*.tipa; do
            unzip -t "$artifact"
            unzip -l "$artifact" | grep -q 'Payload/MG4Mate.app/MG4Mate$'
          done
          (cd dist && shasum -a 256 *.ipa *.tipa > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EVHelper-iOS16-${{ env.ARTIFACT_VARIANT }}-${{ github.run_number }}
          path: |
            dist/*.ipa
            dist/*.tipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EVHelper-build-log-${{ github.run_number }}
          path: build-device/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
