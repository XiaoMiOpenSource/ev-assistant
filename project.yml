name: MG4Mate
options:
  bundleIdPrefix: com.evstats
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "23"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    SUPPORTS_MACCATALYST: "NO"

targets:
  MG4Mate:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/Car
      - path: Shared/EV
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: MG4Mate
        PRODUCT_BUNDLE_IDENTIFIER: com.evstats.EVLogger
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MG4Mate.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MG4MateWidget
        embed: true

  MG4MateWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/Car
      - path: Shared/EV
    settings:
      base:
        PRODUCT_NAME: MG4MateWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.evstats.EVLogger.widget
        INFOPLIST_FILE: Resources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Widget/MG4MateWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  MG4Mate:
    build:
      targets:
        MG4Mate: all
        MG4MateWidget: all
    run:
      config: Debug
    archive:
      config: Release
